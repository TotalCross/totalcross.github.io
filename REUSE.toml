version = 1

# Project metadata and generated files that cannot safely contain comment headers.
[[annotations]]
path = [
  ".docz/app/db.json",
  ".agent/evidence/dependency-advisory-regressions.json",
  "package.json",
  "package-lock.json",
  "public/googledf7144400c12b6c2.html",
  "public/manifest.webmanifest",
  "tsconfig.json",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Amalgam Solucoes em TI Ltda."
SPDX-License-Identifier = "MIT"

# Historical artwork has mixed or unverified provenance and is never auto-relicensed.
[[annotations]]
path = "src/assets/**"
precedence = "override"
SPDX-FileCopyrightText = "Copyright holder(s) of the original material"
SPDX-License-Identifier = "LicenseRef-ThirdParty-Material"

# Customer editorial content is preserved without asserting Amalgam ownership.
[[annotations]]
path = [
  "src/assets/tecdet.jpg",
  "src/content/blog/traffic-control-system-by-tecdet.md",
  "src/pages/traffic-control-system-by-tecdet/index.astro",
]
precedence = "override"
SPDX-FileCopyrightText = "Copyright holder(s) of the Tecdet customer material"
SPDX-License-Identifier = "LicenseRef-ThirdParty-Material"

# Legacy visual baselines and regression evidence contain mixed brand/customer material.
[[annotations]]
path = [
  ".agent/baseline/screenshots/**",
  ".agent/evidence/screenshots/**",
]
precedence = "override"
SPDX-FileCopyrightText = "Copyright holder(s) of the captured legacy site material"
SPDX-License-Identifier = "LicenseRef-ThirdParty-Material"

# Clear TotalCross identity assets are excluded from source/editorial license grants.
[[annotations]]
path = [
  "src/assets/logo-totalcross.png",
  "public/apple-touch-icon.png",
  "public/favicon.ico",
  "public/favicon-32x32.png",
  "public/icons/**",
  "public/totalcross_logo.png",
]
precedence = "override"
SPDX-FileCopyrightText = "Copyright holder(s) of the TotalCross brand assets"
SPDX-License-Identifier = "LicenseRef-TotalCross-Brand"
