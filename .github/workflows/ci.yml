name: Validate source

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build validated Pages artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run license:check:all
      - run: npm run license:test
      - run: npm run cross-post:test
      - run: npm run release:check
      - run: npm run check
      - run: npm run build
      - run: npm run assets:check
      - run: npm run validate
      - name: Package Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-pr-${{ github.event.pull_request.number }}
          path: dist
