name: Validate source

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build validated Pages artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm audit signatures
      - run: npm run security:advisories:check
      - run: npm run security:advisories:test
      - run: npm run license:check:all
      - run: npm run license:test
      - run: npm run cross-post:test
      - run: npm run release:check
      - run: npm run check
      - run: npm run build
      - run: npm run assets:check
      - run: npm run validate
      - name: Package Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          name: github-pages-pr-${{ github.event.pull_request.number }}
          path: dist
